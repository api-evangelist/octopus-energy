  description: >-
    The Octopus Energy GraphQL API is the primary Kraken interface for partner and customer-facing integrations.
    A single /v1/graphql/ endpoint exposes queries and mutations grouped into API Collections by feature
    — accounts, ledgers, billing, smart meters, half-hourly consumption, EV chargers, heat pumps, batteries,
    Intelligent Octopus dispatch schedules, and Octopus Electroverse devices. Kraken's GraphQL introspection
    plus a public changelog let third-party developers build smart-charging, demand-response, and home-energy-management
    apps directly against Kraken-powered utilities.
