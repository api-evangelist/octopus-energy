  description: >-
    The Octopus Energy developer portal exposes a Kraken-backed REST API alongside the public GraphQL
    surface. The REST API is generated from an OpenAPI specification published in the developer portal
    Reference section, with API Collections that group endpoints by feature. Partners use the REST API
    for account onboarding, meter-point registration, consumption pulls, and tariff lookups against the
    Kraken energy operating system.
