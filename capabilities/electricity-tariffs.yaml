naftiko: 1.0.0-alpha2
info:
  label: Octopus Energy Public API — Electricity Tariffs
  description: 'Octopus Energy Electricity Tariffs. 4 operations covering standard unit rates, standing charges, day rates, and night rates.'
  tags: [Octopus Energy, Electricity, Tariffs, Agile, Tracker]
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    OCTOPUS_API_KEY: OCTOPUS_API_KEY
capability:
  consumes:
  - type: http
    namespace: electricity-tariffs
    baseUri: https://api.octopus.energy/v1
    description: Electricity tariff rates and standing charges.
    resources:
    - name: electricity-standard-unit-rates
      path: /products/{product_code}/electricity-tariffs/{tariff_code}/standard-unit-rates/
      operations:
      - name: liststandardunitrates
        method: GET
        description: List Electricity Standard Unit Rates
        outputRawFormat: json
        outputParameters:
        - {name: result, type: object, value: $.}
    - name: electricity-standing-charges
      path: /products/{product_code}/electricity-tariffs/{tariff_code}/standing-charges/
      operations:
      - name: liststandingcharges
        method: GET
        description: List Electricity Standing Charges
        outputRawFormat: json
        outputParameters:
        - {name: result, type: object, value: $.}
    - name: electricity-day-unit-rates
      path: /products/{product_code}/electricity-tariffs/{tariff_code}/day-unit-rates/
      operations:
      - name: listdayunitrates
        method: GET
        description: List Electricity Day Unit Rates
        outputRawFormat: json
        outputParameters:
        - {name: result, type: object, value: $.}
    - name: electricity-night-unit-rates
      path: /products/{product_code}/electricity-tariffs/{tariff_code}/night-unit-rates/
      operations:
      - name: listnightunitrates
        method: GET
        description: List Electricity Night Unit Rates
        outputRawFormat: json
        outputParameters:
        - {name: result, type: object, value: $.}
    authentication:
      type: basic
      username: '{{env.OCTOPUS_API_KEY}}'
      password: ''
  exposes:
  - type: mcp
    namespace: electricity-tariffs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Octopus Energy Electricity Tariffs.
    tools:
    - name: octopus-list-electricity-standard-unit-rates
      description: List Electricity Standard Unit Rates (Agile, Tracker, fixed)
      hints: {readOnly: true, destructive: false, idempotent: true}
      call: electricity-tariffs.liststandardunitrates
      outputParameters: [{type: object, mapping: $.}]
    - name: octopus-list-electricity-standing-charges
      description: List Electricity Standing Charges
      hints: {readOnly: true, destructive: false, idempotent: true}
      call: electricity-tariffs.liststandingcharges
      outputParameters: [{type: object, mapping: $.}]
    - name: octopus-list-electricity-day-unit-rates
      description: List Economy 7 day-rate unit prices
      hints: {readOnly: true, destructive: false, idempotent: true}
      call: electricity-tariffs.listdayunitrates
      outputParameters: [{type: object, mapping: $.}]
    - name: octopus-list-electricity-night-unit-rates
      description: List Economy 7 night-rate unit prices
      hints: {readOnly: true, destructive: false, idempotent: true}
      call: electricity-tariffs.listnightunitrates
      outputParameters: [{type: object, mapping: $.}]
