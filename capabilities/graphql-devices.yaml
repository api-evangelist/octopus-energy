naftiko: 1.0.0-alpha2
info:
  label: Octopus Energy Kraken GraphQL API — Devices
  description: Kraken GraphQL surface for smart-meter devices, EV chargers, heat pumps, and home batteries exposed at /v1/graphql/.
  tags: [Octopus Energy, Kraken, GraphQL, Devices, EV, Heat Pumps]
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    KRAKEN_GRAPHQL_TOKEN: KRAKEN_GRAPHQL_TOKEN
capability:
  consumes:
  - type: http
    namespace: graphql-devices
    baseUri: https://api.octopus.energy/v1
    description: Kraken GraphQL endpoint for device queries and mutations.
    resources:
    - name: graphql
      path: /graphql/
      operations:
      - name: querydevices
        method: POST
        description: Query Kraken devices via GraphQL — smart meters, EV chargers, heat pumps, batteries.
        outputRawFormat: json
        outputParameters:
        - {name: result, type: object, value: $.}
        inputParameters:
        - {name: body, in: body, type: object, description: GraphQL request body with query and variables., required: true}
    authentication:
      type: bearer
      token: '{{env.KRAKEN_GRAPHQL_TOKEN}}'
  exposes:
  - type: mcp
    namespace: graphql-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kraken GraphQL device operations.
    tools:
    - name: kraken-graphql-devices
      description: Execute a Kraken GraphQL query or mutation against the devices surface.
      hints: {readOnly: false, destructive: false, idempotent: false}
      call: graphql-devices.querydevices
      with: {body: tools.body}
      outputParameters: [{type: object, mapping: $.}]
